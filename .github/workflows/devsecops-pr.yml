name: DevSecOps Pipeline - PR (Incremental)

on:
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  security-events: write
  pull-requests: write

jobs:
  # ─────────────────────────────────────────
  # JOB 1: SAST - SonarCloud
  # ─────────────────────────────────────────
  sast-incremental:
    name: SAST - SonarCloud (PR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@4006f663ecaf1f8093e8e4abb9227f6041f52216
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=tkdn00_juice-shop-bachelor-work
            -Dsonar.organization=tkdn00
          projectBaseDir: .

  # ─────────────────────────────────────────
  # JOB 2: SCA - Snyk
  # ─────────────────────────────────────────
  sca-incremental:
    name: SCA - Snyk (changed deps only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check if dependencies changed
        id: changed
        run: |
          CHANGED=$(git diff --name-only origin/master...HEAD)
          echo "Changed files: $CHANGED"
          if echo "$CHANGED" | grep -q "package.json\|package-lock.json"; then
            echo "deps_changed=true" >> $GITHUB_OUTPUT
            echo "⚠️ Dependencies changed - running Snyk scan"
          else
            echo "deps_changed=false" >> $GITHUB_OUTPUT
            echo "✅ No dependency changes - skipping Snyk scan"
          fi

      - name: Install Snyk
        if: steps.changed.outputs.deps_changed == 'true'
        uses: snyk/actions/setup@806182742461562b67788a64410098c9d9b96adb
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk scan
        if: steps.changed.outputs.deps_changed == 'true'
        run: snyk test --severity-threshold=high --json > snyk-report-pr.json || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Upload Snyk report
        if: steps.changed.outputs.deps_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report-pr
          path: snyk-report-pr.json

  # ─────────────────────────────────────────
  # JOB 3: Вимірювання часу
  # ─────────────────────────────────────────
  timing:
    name: Pipeline Timing
    runs-on: ubuntu-latest
    needs: [sast-incremental, sca-incremental]
    if: always()
    steps:
      - name: Log timing
        run: |
          echo "=== INCREMENTAL PIPELINE TIMING ==="
          echo "Jobs completed: SAST + SCA only"
          echo "Skipped: Trivy, ZAP (full scan on master only)"

  # ─────────────────────────────────────────
  # JOB 4: PR Comment з результатами
  # ─────────────────────────────────────────
  pr-comment:
    name: PR Security Summary
    runs-on: ubuntu-latest
    needs: [sast-incremental, sca-incremental]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download Snyk report
        uses: actions/download-artifact@v4
        with:
          name: snyk-report-pr
        continue-on-error: true

      - name: Get SonarCloud results
        id: sonar
        run: |
          RESPONSE=$(curl -s -u ${{ secrets.SONAR_TOKEN }}: \
            "https://sonarcloud.io/api/issues/search?projectKeys=tkdn00_juice-shop-bachelor-work&types=VULNERABILITY&severities=CRITICAL,MAJOR,MINOR&resolved=false")

          CRITICAL=$(echo $RESPONSE | python3 -c "
          import json,sys
          data=json.load(sys.stdin)
          print(sum(1 for i in data.get('issues',[]) if i.get('severity')=='CRITICAL'))
          " 2>/dev/null || echo "0")

          MAJOR=$(echo $RESPONSE | python3 -c "
          import json,sys
          data=json.load(sys.stdin)
          print(sum(1 for i in data.get('issues',[]) if i.get('severity')=='MAJOR'))
          " 2>/dev/null || echo "0")

          MINOR=$(echo $RESPONSE | python3 -c "
          import json,sys
          data=json.load(sys.stdin)
          print(sum(1 for i in data.get('issues',[]) if i.get('severity')=='MINOR'))
          " 2>/dev/null || echo "0")

          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "minor=$MINOR" >> $GITHUB_OUTPUT

      - name: Create PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Парсимо Snyk звіт
            let snykCritical = 0, snykHigh = 0, snykMedium = 0;
            let snykStatus = '⏭️ Пропущено (залежності не змінились)';
            try {
              const snyk = JSON.parse(fs.readFileSync('snyk-report-pr.json', 'utf8'));
              for (const v of snyk.vulnerabilities || []) {
                if (v.severity === 'critical') snykCritical++;
                if (v.severity === 'high') snykHigh++;
                if (v.severity === 'medium') snykMedium++;
              }
              snykStatus = `✅ Critical: ${snykCritical} | High: ${snykHigh} | Medium: ${snykMedium}`;
            } catch(e) {
              snykStatus = '⏭️ Пропущено (залежності не змінились)';
            }

            // SonarCloud дані
            const sonarCritical = '${{ steps.sonar.outputs.critical }}';
            const sonarMajor = '${{ steps.sonar.outputs.major }}';
            const sonarMinor = '${{ steps.sonar.outputs.minor }}';
            const sonarUrl = 'https://sonarcloud.io/project/overview?id=tkdn00_juice-shop-bachelor-work';
            const sonarStatus = `✅ Critical: ${sonarCritical} · Major: ${sonarMajor} · Minor: ${sonarMinor} · [Дашборд](${sonarUrl})`;
            const comment = `## 🔐 Security Scan Results (Incremental)

            | Етап | Статус |
            |------|--------|
            | ☁️ SAST (SonarCloud) | ${sonarStatus} |
            | 🔍 SCA (Snyk) | ${snykStatus} |
            | 🐳 Container Scan (Trivy) | ⏭️ Пропущено — виконується після merge у master |
            | 🕷️ DAST (ZAP) | ⏭️ Пропущено — виконується після merge у master |

            ---


            > 🔒 Повне сканування запуститься автоматично після merge у master
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });